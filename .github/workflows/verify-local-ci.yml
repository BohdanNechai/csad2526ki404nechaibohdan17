on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-local-ci:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x ci.sh || true
          ./ci.sh
      - name: Setup (Windows)
        if: runner.os == 'Windows'
        run: |
          REM run ci.cmd in cmd.exe
          cmd /c "%~dp0ci.cmd"